<body class="constellation">
  <header class="cn-header">
  <nav class="topnav" aria-label="Site">
    <a href="index.html">home</a>
    <a href="about.html">about</a>
    <a href="resume.html">resume</a>

    <a href="contact.html">contact</a>
  </nav>

  <p class="cn-intro" id="cnIntro" hidden></p>
  </header>

  <main class="cn-stage" id="stage" aria-label="Media sections, arranged in a ring">
    <div class="cn-world" id="world">
      <svg class="cn-svg" id="cnSvg" aria-hidden="true" focusable="false">
        <g id="gLines"></g>
        <g id="gShapes"></g>
        <g id="gDots"></g>
        <g id="gParticles"></g>
      </svg>
      <div class="cn-labels" id="labels"></div>
      <div class="cn-dots" id="dotButtons"></div>
      <div class="cn-bubbles" id="bubbles"></div>
    </div>

    <noscript>
      <p class="cn-noscript">This page needs JavaScript to draw its constellation.</p>
    </noscript>
  </main>

  <div class="cn-controls" role="group" aria-label="View">
    <button type="button" id="btnRecenter" aria-label="Recenter" title="Recenter">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="10" cy="10" r="6.5" />
        <circle cx="10" cy="10" r="1.3" fill="currentColor" stroke="none" />
      </svg>
    </button>
    <button type="button" id="btnFitAll" aria-label="Fit everything on screen" title="Fit all">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M3 7.5V3h4.5M12.5 3H17v4.5M17 12.5V17h-4.5M7.5 17H3v-4.5" />
      </svg>
    </button>
  </div>

  <!-- Plain text copy of every section for screen readers (filled in from the data file). -->
  <div class="sr-only" id="textVersion"></div>

</html>
